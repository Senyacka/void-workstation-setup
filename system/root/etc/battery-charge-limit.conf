# Charge limit policy for the battery (BAT0 on most laptops).
#
# The value is owned by DMS: Settings -> Power & battery -> Charge limit (50..100),
# then "Apply to hardware". DMS writes the sysfs attribute itself through pkexec,
# so nothing here has to be edited when the slider moves - battery-charge-limit
# picks the new value up from sysfs and remembers it for the next boot.
#
# LIMIT is only the starting point: the value used until a limit has been adopted
# once (that value lives in /var/lib/battery-charge-limit/limit).
LIMIT=80

# DMS settings file. Only its modification time is read: a threshold of 100 means
# both "no limit" in DMS and "threshold forgotten" for the EC, and a fresh
# settings write is what tells those two apart.
DMS_SETTINGS=@HOME@/.config/dms/settings.json

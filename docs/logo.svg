    <path d="M-12 172 C 44 140, 62 188, 124 156 S 214 112, 268 148"/>
    <path d="M-12 146 C 44 114, 62 162, 124 130 S 214 86, 268 122"/>
  </g>

  <path d="M76 72 L128 188 L180 72" fill="none" stroke="url(#mark)"

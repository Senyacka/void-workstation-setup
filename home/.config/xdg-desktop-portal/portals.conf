# Переопределение бэкендов xdg-desktop-portal для niri.
#
# Проблема: штатный /usr/share/xdg-desktop-portal/niri-portals.conf задаёт
# default=gnome;gtk;, поэтому FileChooser уходит в xdg-desktop-portal-gnome,
# а тот делегирует диалог Nautilus. Nautilus не установлен (используется
# Thunar), вызов падает молча — в логе niri видно:
#   Delegated FileChooser call failed: The name org.gnome.Nautilus was not
#   provided by any .service files
# В результате в Firefox (about:logins → Import from a File…) и в других
# приложениях диалог выбора файла просто не появляется.
#
# Решение: FileChooser отдаём GTK-бэкенду (он рисует диалог сам), остальное
# оставляем как было — ScreenCast на niri работает через gnome-бэкенд,
# Secret — через gnome-keyring.
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
org.freedesktop.impl.portal.FileChooser=gtk;

<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- 3K-панель при scale 1.5: без subpixel-сглаживания, лёгкий хинтинг. -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>

  <!-- Единая типографика с оболочкой DMS: Cantarell (кириллица, стрелки) и Fira Code. -->
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Roboto</family><family>Cantarell</family></prefer>
  </alias>
  <alias binding="same">
    <family>sans</family>
    <prefer><family>Roboto</family><family>Cantarell</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>FiraCode Nerd Font</family></prefer>
  </alias>
</fontconfig>
